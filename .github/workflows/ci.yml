name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Core unit tests
        shell: bash
        run: |
          set +e
          swift test --package-path Core > test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # surface compile/test errors as annotations (readable without log access)
            grep -E 'error:|Fatal error|failed \(|XCTAssert' test.log | head -25 | while IFS= read -r line; do
              echo "::error::${line:0:220}"
            done
            if ! grep -qE 'error:|Fatal error|failed \(' test.log; then
              tail -n 8 test.log | while IFS= read -r line; do
                echo "::error::${line:0:220}"
              done
            fi
            exit "$status"
          fi
