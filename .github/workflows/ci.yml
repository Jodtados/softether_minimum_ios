name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Core unit tests
        run: |
          set -o pipefail
          swift test --package-path Core 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # surface compile/test errors as annotations (readable without log access)
            grep -E 'error:|Fatal error|failed \(|XCTAssert' test.log | head -30 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-220)"
            done
            if ! grep -qE 'error:|Fatal error|failed \(' test.log; then
              tail -n 10 test.log | while IFS= read -r line; do
                echo "::error::$(echo "$line" | cut -c1-220)"
              done
            fi
            exit "$status"
          fi
