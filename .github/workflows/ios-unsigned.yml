name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      user_build:
        description: 'dev-сборка: показать UI экспорта QR (тег-сборки всегда без него)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # XOR-encode the repo secrets (MGMT_URL / MGMT_TOKEN / MGMT_TOTP /
      # QR_SECRET) into the generated Info.plist — the same scheme as
      # App/Sources/Mgmt/MgmtSecrets.swift. Plain values never land in the
      # repo or the binary; unset secrets leave the defaults empty (mgmt
      # dormant, QR secret asked in Settings) and the step exits quietly.
      - name: Bake management secrets
        shell: bash
        env:
          MGMT_URL: ${{ secrets.MGMT_URL }}
          MGMT_TOKEN: ${{ secrets.MGMT_TOKEN }}
          MGMT_TOTP: ${{ secrets.MGMT_TOTP }}
          QR_SECRET: ${{ secrets.QR_SECRET }}
        run: |
          python3 - <<'PY'
          import hashlib, os, plistlib
          values = {"MGMT_B0": os.environ.get("MGMT_URL", ""),
                    "MGMT_B1": os.environ.get("MGMT_TOKEN", ""),
                    "MGMT_B2": os.environ.get("MGMT_TOTP", ""),
                    "QR_B3": os.environ.get("QR_SECRET", "")}
          if not any(values.values()):
              print("no secrets configured — defaults stay empty")
              raise SystemExit(0)
          seed = "mvc-6f2c-9d41-b7e8"
          key = hashlib.sha256(seed.encode()).digest()
          def enc(plain):
              return bytes(b ^ key[i % len(key)] for i, b in enumerate(plain.encode())).hex()
          with open("App/Info.plist", "rb") as f:
              plist = plistlib.load(f)
          for name, plain in values.items():
              if plain:
                  plist[name] = enc(plain)
          with open("App/Info.plist", "wb") as f:
              plistlib.dump(plist, f)
          print("baked keys:", sorted(k for k in values if values[k]))
          PY

      - name: Build (unsigned)
        shell: bash
        run: |
          # tag builds ARE the user delivery: hide the QR export menu
          # (USER_BUILD, same convention as the Android fleet); a manual
          # dispatch with user_build=true compiles the dev UI with export
          FLAGS="OTHER_SWIFT_FLAGS=-DUSER_BUILD"
          if [ "${{ inputs.user_build }}" = "true" ]; then
            FLAGS=""
          fi
          set +e
          xcodebuild \
            -project softether.xcodeproj \
            -scheme softether \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' $FLAGS build > build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E 'error:' build.log | head -25 | while IFS= read -r line; do
              echo "::error::${line:0:220}"
            done
            if ! grep -q 'error:' build.log; then
              tail -n 8 build.log | while IFS= read -r line; do
                echo "::error::${line:0:220}"
              done
            fi
            exit "$status"
          fi

      - name: Pack unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/Build/Products/Release-iphoneos/softether.app" build/ipa/Payload/
          cd build/ipa && zip -qry ../SoftEther-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SoftEther-unsigned
          path: build/SoftEther-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/SoftEther-unsigned.ipa \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned IPA. Установка через Sideloadly (инструкция в README)."
